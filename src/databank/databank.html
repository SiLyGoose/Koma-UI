<!-- The databank (src/databank/page.ts): every item in the game, the raid bosses, and the raid classes. Swapped into #view by src/site/main.ts. -->
<main class="gear-page databank-page">
  <p id="status" class="status" hidden></p>

  <!--
    Across the top, at the right: the server picker (logged in, in more than one server), and the X out of a
    section, back to the way in (which has none itself).
  -->
  <div id="db-bar" class="db-bar" hidden>
    <select id="server" class="server-pick" aria-label="Server" hidden></select>
    <!-- The site's X (src/shared/ui/close/ draws it; a .back link, so the page wipes the way going back does). -->
    <a id="db-close" class="back" href="/databank/" aria-label="Back to the Databank" hidden></a>
  </div>

  <!--
    The way in (/databank/): what there is to look up, each a mark on a star chart (src/databank/hub.ts fills
    them in, with how many there are). The chart's lines are only for show; its dots go round the rings
    they sit on (src/databank/styles/hub.css), as the backdrop's moons do.
  -->
  <section id="db-hub" class="db-hub" aria-label="Databank" hidden>
    <svg class="db-chart" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle class="db-chart-line" cx="330" cy="330" r="250" />
      <circle class="db-chart-line" cx="690" cy="230" r="190" />
      <circle class="db-chart-line faint" cx="500" cy="280" r="430" />
      <circle class="db-chart-line faint" cx="500" cy="280" r="92" />
      <path class="db-chart-line faint" d="M-20 470 1020 110M180 -20 420 580M620 -20 860 580" />
      <g class="db-chart-orbit left">
        <circle class="db-chart-dot" cx="114" cy="204" r="4" />
        <circle class="db-chart-dot" cx="546" cy="456" r="4" />
      </g>
      <g class="db-chart-orbit right">
        <circle class="db-chart-dot" cx="872" cy="176" r="4" />
        <circle class="db-chart-dot" cx="560" cy="92" r="3" />
      </g>
      <g class="db-chart-orbit middle">
        <circle class="db-chart-dot" cx="414" cy="248" r="3.5" />
      </g>
    </svg>
    <h2 class="db-hub-title plaque">Databank</h2>
    <nav id="db-nodes" class="db-nodes" aria-label="Databank sections"></nav>
  </section>

  <!-- The items (/databank/items/). -->
  <section id="databank" class="databank panels" hidden>
    <!-- The item picked: what it does at each level. Beside the list on wide screens, a sheet from the bottom on narrow ones. -->
    <aside id="detail" class="detail" aria-label="Item" hidden>
      <div class="armory-plaque plaque"><span>Item Info</span></div>
      <div class="armory-sheet db-sheet">
        <div id="detail-body" class="sheet-scroll"></div>
        <!-- Whether they own it: under a line, fixed at the bottom while the rest scrolls. -->
        <p id="detail-owned" class="db-owned-line" hidden></p>
      </div>
    </aside>

    <!-- Every item in the game, by star tier, on parchment. -->
    <div class="armory">
      <div class="armory-plaque plaque"><span>Items</span></div>
      <!-- The search, and the Filter (src/shared/items/armory-filter/ fills it in). -->
      <div class="armory-tools">
        <input id="search" class="armory-search" type="search" placeholder="Search items" aria-label="Search items" autocomplete="off" />
        <div id="filter" class="armory-filter"></div>
      </div>
      <div class="armory-sheet">
        <div class="sheet-scroll">
          <div id="db-list" class="db-list"></div>
        </div>
      </div>
      <p id="db-count" class="db-count"></p>
    </div>
  </section>

  <!-- The raid bosses (/databank/bosses/; src/databank/bosses.ts): a card for each, and the one picked beside them. -->
  <section id="db-bosses" class="db-bosses panels" hidden>
    <div class="armory db-boss-pick">
      <div class="armory-plaque plaque"><span>Raid Bosses</span></div>
      <div id="boss-list" class="db-boss-list no-scrollbar"></div>
      <p id="boss-count" class="db-count"></p>
    </div>

    <!-- The boss picked: what it does, and what each difficulty level makes of it. -->
    <article id="boss-info" class="armory db-boss-info" aria-label="Boss" hidden>
      <div class="armory-plaque plaque"><span>Boss Info</span></div>
      <div class="armory-sheet db-sheet">
        <div id="boss-body" class="sheet-scroll"></div>
      </div>
    </article>
  </section>

  <!-- The raid classes (/databank/classes/; src/databank/classes.ts): a card for each, and the one picked beside them, in the bosses' frames. -->
  <section id="db-classes" class="db-bosses db-classes panels" hidden>
    <div class="armory db-boss-pick">
      <div class="armory-plaque plaque"><span>Classes</span></div>
      <div id="class-list" class="db-boss-list db-class-list no-scrollbar"></div>
      <p id="class-count" class="db-count"></p>
    </div>

    <!-- The class picked: what it does in a raid, and its class items. -->
    <article id="class-info" class="armory db-boss-info" aria-label="Class" hidden>
      <div class="armory-plaque plaque"><span>Class Info</span></div>
      <div class="armory-sheet db-sheet">
        <div id="class-body" class="sheet-scroll"></div>
      </div>
    </article>
  </section>
</main>
