<!-- The dressing room (src/dressing/page.ts): every outfit down the left, the one picked standing on the right, to put on. Swapped into #view by src/site/main.ts. -->
<main class="dressing-page">
  <!-- The site's page bar (../shared/ui/page-bar/): back and the server at its left, its name in the middle. -->
  <div class="page-bar">
    <div class="page-bar-left">
      <a class="action secondary icon" href="/player/" aria-label="Back to Player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 5 3.5 12l7 7v-4.5H20v-5h-9.5z" /></svg>
      </a>
      <select id="server" class="server-pick" aria-label="Server" hidden></select>
    </div>
    <h1 class="page-bar-title">Dressing Room</h1>
    <div class="page-bar-right"></div>
  </div>

  <p id="status" class="status dressing-status" hidden></p>

  <div id="room" class="dressing-room" hidden>
    <!-- Every outfit (render.ts): a close-up of its character (head and shoulders), its name, and whether it's worn, theirs, or its price. -->
    <section class="dressing-list-panel" aria-labelledby="list-title">
      <h2 id="list-title" class="dressing-list-title">Outfit List</h2>
      <div id="list" class="dressing-list" role="listbox" aria-labelledby="list-title"></div>
    </section>

    <!-- The one picked, standing full height: its name, and Wear (or that it's worn, said in its place by render.ts, or the shop to get it). -->
    <section class="dressing-stage" aria-live="polite">
      <div class="dressing-figure">
        <img id="model" class="dressing-model" alt="" />
        <div class="dressing-floor" aria-hidden="true"></div>
      </div>
      <div class="dressing-foot">
        <div class="dressing-info">
          <h2 id="model-name" class="dressing-name"></h2>
          <p id="model-state" class="dressing-state"></p>
        </div>
        <button type="button" id="wear" class="dressing-action action main large">Wear</button>
        <a id="get" class="dressing-action action secondary large" href="/shop/outfits/" hidden>Get in Shop</a>
      </div>
    </section>
  </div>
</main>
