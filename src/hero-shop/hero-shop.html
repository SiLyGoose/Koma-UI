<!-- The heroes for sale (src/hero-shop/page.ts): a card for each, with its picture, its class and its price. The shop's Heroes tab, swapped into its panel by src/shop/page.ts. Laid out as the Outfits tab (its outfits.css). -->
<section class="outfits-page hero-shop">
  <div class="outfits-bar">
    <select id="server" class="server-pick" aria-label="Server" hidden></select>
    <h2 class="outfits-title plaque">Heroes</h2>
    <p class="outfits-wallet"><span id="balance" class="outfits-purse" title="zeiucoins" hidden></span></p>
  </div>

  <p id="status" class="status outfits-status" hidden></p>

  <!--
    The Filter (src/shared/ui/hero-filter/ fills it in: the class, the line it stands in, the kind of damage, and Show owned), at the
    left over the cards, and beside it a button for each line (page.ts: its Position, at a press); then a card for each hero it leaves, A to Z (page.ts): its picture and class badge, its name, and at the bottom
    its price, or that it's theirs. On bigger screens one grid together; on phones, the cards a row that scrolls sideways (hero-shop.css).
  -->
  <div class="hero-shop-cards">
    <div id="tools" class="hero-shop-tools">
      <div id="hero-filter" class="armory-filter"></div>
      <div id="lines" class="hero-shop-lines" role="group" aria-label="Position"></div>
    </div>
    <div id="heroes" class="outfits-row"></div>
  </div>
  <p id="empty" class="status outfits-status" hidden></p>

  <!--
    Buying one (page.ts renderBuy): its card, and beside it its name, class, line and kind of damage, the raids' bosses it's recommended
    against and its teammates (as the databank's heroes have them); its skills in a line each across the whole box under them; then what
    it costs (in red when it's more than they have). Not a <dialog>, as the Outfits tab's isn't.
  -->
  <div id="buy" class="outfits-buy" role="dialog" aria-modal="true" aria-labelledby="buy-title" tabindex="-1" hidden>
    <div class="outfits-buy-box hero-buy-box">
      <div class="hero-buy-top">
        <div class="outfits-buy-figure hero-buy-figure"><img id="buy-picture" class="hero-buy-picture" alt="" hidden /></div>
        <div class="hero-buy-about">
          <h3 id="buy-title"></h3>
          <p id="buy-kind" class="hero-buy-kind"></p>
          <div id="buy-info" class="hero-buy-info"></div>
        </div>
      </div>
      <div id="buy-skills" class="hero-buy-skills"></div>
      <div class="hero-buy-end">
        <p id="buy-price" class="outfits-buy-price"></p>
        <div class="outfits-buy-foot">
          <button type="button" class="action secondary" data-buy="cancel">Cancel</button>
          <button type="button" class="action main" data-buy="confirm">Buy</button>
        </div>
      </div>
    </div>
  </div>
</section>
