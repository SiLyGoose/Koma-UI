<!-- The heroes' outfits for sale (src/hero-outfit-shop/page.ts): the heroes as the Heroes tab has them, and under the one pressed its outfits. The shop's Hero Outfits tab, swapped into its panel by src/shop/page.ts. Laid out as the Heroes tab (its hero-shop.css), which is laid out as the Outfits tab (outfits.css). -->
<section class="outfits-page hero-shop hero-outfit-shop">
  <div class="outfits-bar">
    <select id="server" class="server-pick" aria-label="Server" hidden></select>
    <h2 class="outfits-title plaque">Hero Outfits</h2>
    <p class="outfits-wallet"><span id="balance" class="outfits-purse" title="zeiucoins" hidden></span></p>
  </div>

  <p id="status" class="status outfits-status" hidden></p>

  <!--
    As the Heroes tab: the Filter (src/shared/ui/hero-filter/: class, line, damage; every hero shown, theirs too), beside it Front,
    Middle and Back, and Owned Heroes (only theirs); then a card for each hero with outfits it leaves, A to Z (page.ts). Pressing one
    opens its drawer (page.ts placeDrawer): its outfits, under its row with a caret up to it (on phones, beside it in the row, which
    scrolls sideways, with a caret back to it).
  -->
  <div class="hero-shop-cards">
    <div id="tools" class="hero-shop-tools">
      <!-- The Filter, Front, Middle and Back, then Owned Heroes (page.ts): on phones one row that scrolls sideways. -->
      <div id="chips" class="hos-chips no-scrollbar">
        <div id="hero-filter" class="armory-filter"></div>
        <div id="lines" class="hero-shop-lines" role="group" aria-label="Position"></div>
      </div>
    </div>
    <div id="heroes" class="outfits-row"></div>
  </div>
  <p id="empty" class="status outfits-status" hidden></p>

  <!--
    Buying one: its card, its name and whose it is, and what it costs (in red when it's more than they have); Try On in its hero's
    outfit room (src/hero-outfits/), and Buy, or for a hero they don't own, the way to recruit it.
  -->
  <div id="buy" class="outfits-buy" role="dialog" aria-modal="true" aria-labelledby="buy-title" tabindex="-1" hidden>
    <div class="outfits-buy-box hos-buy-box">
      <div class="outfits-buy-figure hos-buy-figure"><img id="buy-card" class="hos-buy-card" alt="" /></div>
      <h3 id="buy-title"></h3>
      <p id="buy-hero" class="hos-buy-hero"></p>
      <p id="buy-price" class="outfits-buy-price"></p>
      <div class="outfits-buy-foot">
        <button type="button" class="action secondary" data-buy="cancel">Cancel</button>
        <a id="buy-try" class="action secondary" href="/hero-outfits/">Try On</a>
        <button type="button" class="action main" data-buy="confirm">Buy</button>
        <a id="buy-recruit" class="action main" href="/shop/heroes/" hidden>Recruit Hero</a>
      </div>
    </div>
  </div>
</section>
