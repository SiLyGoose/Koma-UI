<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Koma Mines</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>" />
  </head>
  <body>
    <main id="app" class="mx">
      <header class="top">
        <a class="back" href="/" aria-label="Back to the games">←</a>
        <h1>💎 Mines</h1>
        <span id="conn" class="conn">Connecting…</span>
      </header>

      <div class="mx-game">
        <form id="panel" class="mx-panel" autocomplete="off">
          <div class="mx-balance"><span>Balance</span><b id="balance">–</b></div>

          <label class="mx-label" for="bet">Bet amount <span id="bet-range" class="mx-range"></span></label>
          <div class="mx-bet-row">
            <input id="bet" class="mx-input" type="number" inputmode="numeric" min="1" step="1" />
            <button type="button" class="mx-chip" data-bet="half">½</button>
            <button type="button" class="mx-chip" data-bet="double">2×</button>
            <button type="button" class="mx-chip" data-bet="max">Max</button>
          </div>

          <label class="mx-label" for="mines">Mines</label>
          <select id="mines" class="mx-input mx-select"></select>

          <button type="submit" id="action" class="mx-action" disabled>Bet</button>
          <button type="button" id="random" class="mx-random" hidden>Pick a random tile</button>

          <div class="mx-odds">
            <div><span>Multiplier</span><b id="mult">1.00x</b></div>
            <div><span id="next-label">First gem</span><b id="next">–</b></div>
            <div><span>Gems</span><b id="gems">–</b></div>
            <div><span>Max payout</span><b id="max-payout">–</b></div>
          </div>
          <p id="error" class="mx-error" hidden></p>
          <p id="idle" class="mx-idle" hidden></p>
        </form>

        <div class="mx-board-wrap">
          <div id="board" class="mx-board" role="grid" aria-label="The board"></div>
          <div id="result" class="mx-result" hidden>
            <b id="result-mult"></b>
            <span id="result-text"></span>
          </div>
        </div>
      </div>

      <p class="hint">Click tiles to turn them over · Enter to bet or cash out · R for a random tile</p>
    </main>

    <div id="message" class="message" hidden>
      <div class="message-card">
        <div class="message-title" id="message-title"></div>
        <div class="message-text" id="message-text"></div>
        <a class="message-link" href="/">Go to the games</a>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
