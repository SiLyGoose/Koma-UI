<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Koma Mine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>" />
  </head>
  <body>
    <main id="app">
      <header class="top">
        <a class="back" href="/" aria-label="Back to the games">←</a>
        <h1>⛏️ Koma Mine</h1>
        <span id="conn" class="conn">Connecting…</span>
      </header>

      <section class="hud" aria-live="polite">
        <div class="stat stat-main"><span class="label">Multiplier</span><span id="mult" class="value">–</span></div>
        <div class="stat"><span class="label">Cash out</span><span id="cash" class="value">–</span></div>
        <div class="stat stat-balance"><span class="label">Balance</span><span id="balance" class="value">–</span></div>
        <div class="stat"><span class="label">Field</span><span id="field" class="value">–</span></div>
        <div class="stat"><span class="label">Ores left</span><span id="ores" class="value">–</span></div>
        <div class="stat"><span class="label">Dynamite</span><span id="dyn" class="value">–</span></div>
      </section>

      <div class="board-wrap" id="board-wrap">
        <canvas id="board" aria-label="The mine field"></canvas>
        <div id="floaters" class="floaters"></div>
        <div id="overlay" class="overlay" hidden>
          <div class="overlay-card">
            <div id="overlay-title" class="overlay-title"></div>
            <div id="overlay-text" class="overlay-text"></div>
            <form id="lobby" class="lobby" hidden>
              <label class="bet-label" for="bet">Bet <span id="bet-range" class="bet-range"></span></label>
              <div class="bet-row">
                <input id="bet" class="bet" type="number" inputmode="numeric" min="1" step="1" autocomplete="off" />
                <button type="button" class="chip" data-bet="half">½</button>
                <button type="button" class="chip" data-bet="double">2×</button>
                <button type="button" class="chip" data-bet="max">Max</button>
              </div>
              <button type="submit" id="start" class="start">⛏️ Dig <span class="key">R</span></button>
              <div id="lobby-error" class="lobby-error" hidden></div>
              <div id="lobby-info" class="lobby-info"></div>
            </form>
          </div>
        </div>
      </div>

      <p id="log" class="log">Move with WASD or the arrow keys. Stepping onto a hidden tile digs it.</p>
      <p id="idle" class="idle" hidden></p>

      <div class="controls">
        <div class="dpad" aria-label="Move">
          <button type="button" data-dir="up" class="up" aria-label="Up">▲</button>
          <button type="button" data-dir="left" class="left" aria-label="Left">◀</button>
          <button type="button" data-dir="down" class="down" aria-label="Down">▼</button>
          <button type="button" data-dir="right" class="right" aria-label="Right">▶</button>
        </div>
        <button type="button" id="cashout" class="cashout" disabled>💰 Cash out</button>
      </div>

      <p class="hint">WASD / arrow keys to move · Enter to cash out · R to dig again</p>
      <footer id="legend" class="legend"></footer>
    </main>

    <div id="message" class="message" hidden>
      <div class="message-card">
        <div class="message-title" id="message-title"></div>
        <div class="message-text" id="message-text"></div>
        <a class="message-link" href="/">Go to the games</a>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
