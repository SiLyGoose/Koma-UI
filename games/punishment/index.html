<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Koma Divine Punishment</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  </head>
  <body>
    <!--
      King's Raid's Divine Punishment Raid, its windows one after another as the game has them (../../src/divine/: main.ts puts
      them in the games' frame, page.ts draws them), filling the screen under the frame's bar. Its boss fights are the raid page's
      (../divine/), opened from its map. #apocalypsion is its group's dungeon cards, #apocalypsion/boss its map.
    -->
    <main id="app" class="frame dp-frame" data-title="⚡ Divine Punishment">
      <section class="dp-page">
      <p id="status" class="status dp-status" hidden></p>

      <!--
        Each window is King's Raid's 1920×1080 screen, scaled to the page's width (../../src/divine/divine.css: --u is one of the game's UI
        units), its parts where the game's prefab puts them.
      -->
      <div id="windows" class="dp-windows">
      <!-- PunishmentMainWindow: one group at a time between the goddess statues, its boss, the arrows to the others, and Enter. -->
      <div id="groups" class="dp-stage dp-groups" hidden></div>

      <!-- PunishDungeonTypeSelectWindow: the group's Karma Dungeon and Boss Dungeon cards. -->
      <div id="types" class="dp-stage dp-types" hidden></div>

      <!-- PunishmentRaidWindow: the group's map, its dragons' towers round her arena, each boss's portrait and name. -->
      <div id="map" class="dp-stage dp-map" hidden></div>
      </div>

      <!-- PayShopMessage3ButtonPopup / MessagePopup: asking before something is done (or, with no Cancel, saying why it can't be). -->
      <div id="ask" class="dp-ask" role="dialog" aria-modal="true" aria-labelledby="ask-title" tabindex="-1" hidden>
        <div class="dp-ask-box">
          <h3 id="ask-title" class="dp-ask-title"></h3>
          <button type="button" class="dp-ask-close" data-ask="cancel" aria-label="Close"></button>
          <p id="ask-text" class="dp-ask-text"></p>
          <div class="dp-ask-foot">
            <button type="button" id="ask-cancel" class="dp-button" data-ask="cancel">No</button>
            <button type="button" class="dp-button emphasis" data-ask="confirm">Yes</button>
          </div>
        </div>
      </div>
      </section>
    </main>

    <script type="module" src="/src/divine/main.ts"></script>
  </body>
</html>
