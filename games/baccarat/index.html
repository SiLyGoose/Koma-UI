<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Koma Baccarat</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  </head>
  <body>
    <main id="app" class="frame tb bc" data-title="🃏 Baccarat">
      <div class="tb-layout">
        <div class="tb-game">
          <section class="tb-felt bc-felt" id="felt">
            <!-- The scoreboard, above the hands: the table's last hands, drawn as a casino's roads (../../src/baccarat/scoreboard.ts). -->
            <section class="bc-board" aria-label="Scoreboard">
              <div class="bc-roads">
                <div class="bc-road-area bc-road-bead" title="Bead plate: every hand, in order">
                  <div class="bc-road" id="road-bead"></div>
                  <span class="bc-road-tag">Bead plate</span>
                </div>
                <div class="bc-road-area bc-road-big" title="Big road: a column for each streak of Banker or Player wins">
                  <div class="bc-road" id="road-big"></div>
                  <span class="bc-road-tag">Big road</span>
                </div>
                <div class="bc-road-area bc-road-eye" title="Big eye boy: red when the big road repeats itself one column back, blue when it breaks">
                  <div class="bc-road" id="road-bigEye"></div>
                  <span class="bc-road-tag">Big eye boy</span>
                </div>
                <div class="bc-road-area bc-road-small" title="Small road: the same, two columns back">
                  <div class="bc-road" id="road-small"></div>
                  <span class="bc-road-tag">Small road</span>
                </div>
                <div class="bc-road-area bc-road-roach" title="Cockroach pig: the same, three columns back">
                  <div class="bc-road" id="road-cockroach"></div>
                  <span class="bc-road-tag">Cockroach pig</span>
                </div>
              </div>
              <div class="bc-board-foot">
                <div class="bc-tally" id="tally"></div>
                <div class="bc-ask" title="What the big eye boy, small road and cockroach pig would each get if that side won the next hand">
                  <span class="bc-ask-btn banker">B<span class="bc-ask-marks" id="ask-banker"></span></span>
                  <span class="bc-ask-btn player">P<span class="bc-ask-marks" id="ask-player"></span></span>
                </div>
              </div>
            </section>

            <!-- The two hands. -->
            <div class="bc-hands">
              <div class="bc-hand" id="hand-player" data-side="player">
                <div class="bc-hand-head"><span class="bc-hand-name">Player</span><b class="bc-total" id="total-player"></b></div>
                <div class="bc-cards" id="cards-player"></div>
              </div>
              <div class="bc-mid">
                <div class="bc-vs" id="verdict"></div>
                <div id="result" class="tb-result" hidden>
                  <b id="result-title"></b>
                  <span id="result-text"></span>
                </div>
              </div>
              <div class="bc-hand" id="hand-banker" data-side="banker">
                <div class="bc-hand-head"><span class="bc-hand-name">Banker</span><b class="bc-total" id="total-banker"></b></div>
                <div class="bc-cards" id="cards-banker"></div>
              </div>
            </div>

            <!-- The betting spots: chips are dragged (or tapped) onto these. Everyone's chips show, by their picture. -->
            <div class="bc-spots">
              <button type="button" class="bc-spot bc-side" data-spot="kirin">
                <span class="bc-spot-name">🦄 Kirin</span><span class="bc-spot-odds" data-odds></span>
                <span class="bc-spot-help">Player wins with 3 cards worth 8</span>
                <span class="tb-others"></span>
                <span class="tb-piles"></span>
                <span class="tb-stack"></span>
              </button>
              <button type="button" class="bc-spot bc-tie" data-spot="tie">
                <span class="bc-spot-name">Tie</span><span class="bc-spot-odds" data-odds></span>
                <span class="tb-others"></span>
                <span class="tb-piles"></span>
                <span class="tb-stack"></span>
              </button>
              <button type="button" class="bc-spot bc-side" data-spot="phoenix">
                <span class="bc-spot-name">🐦‍🔥 Phoenix</span><span class="bc-spot-odds" data-odds></span>
                <span class="bc-spot-help">Banker wins with 3 cards worth 7</span>
                <span class="tb-others"></span>
                <span class="tb-piles"></span>
                <span class="tb-stack"></span>
              </button>
              <button type="button" class="bc-spot bc-main bc-player" data-spot="player">
                <span class="bc-spot-name">Player</span><span class="bc-spot-odds" data-odds></span>
                <span class="tb-others"></span>
                <span class="tb-piles"></span>
                <span class="tb-stack"></span>
              </button>
              <button type="button" class="bc-spot bc-main bc-banker" data-spot="banker">
                <span class="bc-spot-name">Banker</span><span class="bc-spot-odds" data-odds></span>
                <span class="tb-others"></span>
                <span class="tb-piles"></span>
                <span class="tb-stack"></span>
              </button>
            </div>
          </section>

          <!-- The rack of chips, and what to do with them (../../src/table/table.ts fills it in). -->
          <section class="tb-panel" data-table-panel></section>
        </div>

        <!-- Everyone at the table. -->
        <aside class="tb-players" data-table-players></aside>
      </div>

      <p class="hint">Drag chips onto the table, or pick a chip and tap a spot · Right-click a spot to take your chips back · The cards are dealt when the timer runs out, or once everyone presses Deal</p>
    </main>

    <script type="module" src="/src/baccarat/main.ts"></script>
  </body>
</html>
