<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Pinecraft</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>" />
  </head>
  <body>
    <main id="app" class="pinecraft">
      <header class="top">
        <a class="back" href="/" aria-label="Back to the games">←</a>
        <h1>🌲 Pinecraft</h1>
        <span id="conn" class="conn">Connecting…</span>
      </header>

      <section class="hud" aria-live="polite">
        <div class="stat stat-energy">
          <span class="label">Energy <span id="energy-next" class="energy-next"></span></span>
          <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
          <span id="energy" class="value">–</span>
        </div>
        <div class="stat stat-balance"><span class="label">Balance</span><span id="balance" class="value">–</span></div>
        <div class="stat"><span class="label">Blocks dug</span><span id="depth" class="value">–</span></div>
      </section>

      <div class="board-wrap pc-view" id="board-wrap">
        <canvas id="board" aria-label="Your mine"></canvas>
        <div id="floaters" class="floaters"></div>
      </div>

      <p id="log" class="log">Hold WASD or the arrow keys against a block to break it. Every block takes one ⚡; harder ones take longer.</p>

      <div class="controls pc-controls">
        <div class="dpad" aria-label="Move">
          <button type="button" data-dir="up" class="up" aria-label="Up">▲</button>
          <button type="button" data-dir="left" class="left" aria-label="Left">◀</button>
          <button type="button" data-dir="down" class="down" aria-label="Down">▼</button>
          <button type="button" data-dir="right" class="right" aria-label="Right">▶</button>
        </div>
        <div class="stat pc-earned"><span class="label">Earned from ores</span><span id="earned" class="value">–</span></div>
      </div>

      <p class="hint">Hold a direction to break a block · dirt breaks fastest, ruby slowest · rarer ores pay more</p>
      <footer id="legend" class="legend pc-legend"></footer>
    </main>

    <div class="pc-touch">
      <div id="stick" class="pc-stick" aria-label="Walk"><div id="stick-knob" class="pc-stick-knob"></div></div>
    </div>

    <div id="message" class="message" hidden>
      <div class="message-card">
        <div class="message-title" id="message-title"></div>
        <div class="message-text" id="message-text"></div>
        <a class="message-link" href="/">Go to the games</a>
      </div>
    </div>

    <script type="module" src="/src/pinecraft/main.ts"></script>
  </body>
</html>
