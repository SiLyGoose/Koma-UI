<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Pinecraft</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>" />
  </head>
  <body>
    <main id="app" class="pinecraft">
      <header class="top">
        <a class="back" href="/" aria-label="Back to the games">←</a>
        <h1>🌲 Pinecraft</h1>
        <span id="conn" class="conn">Connecting…</span>
      </header>

      <section class="hud" aria-live="polite">
        <div class="stat stat-energy">
          <span class="label">Energy <span id="energy-next" class="energy-next"></span></span>
          <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
          <span id="energy" class="value">–</span>
        </div>
        <div class="stat stat-balance"><span class="label">Balance</span><span id="balance" class="value">–</span></div>
        <div class="stat"><span class="label">Blocks dug</span><span id="depth" class="value">–</span></div>
        <div class="stat pc-earned" tabindex="0" aria-describedby="ore-tip">
          <span class="label">Earned from ores <span class="pc-help" aria-hidden="true">?</span></span>
          <span id="earned" class="value">–</span>
          <div id="ore-tip" class="pc-tip" role="tooltip">
            <div class="pc-tip-head"><span>Ore</span><span>Points</span></div>
            <div id="ore-tip-rows" class="pc-tip-rows"></div>
          </div>
        </div>
      </section>

      <div class="pc-stage" id="stage">
        <div class="board-wrap pc-view" id="board-wrap">
          <canvas id="board" aria-label="Your mine"></canvas>
          <div id="floaters" class="floaters"></div>
          <button type="button" id="map-button" class="pc-map-button" aria-label="Open the map (M)" title="Map (M)">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z M9 4v13.5 M15 6.5V20"/></svg><span id="coords">0,0</span>
          </button>
        </div>

        <p id="log" class="log">Hold WASD or the arrow keys against a block to break it. Every block takes one ⚡; harder ones take longer.</p>
        <div id="stick" class="pc-stick" aria-hidden="true"><div id="stick-knob" class="pc-stick-knob"></div></div>
      </div>

      <footer id="legend" class="legend pc-legend"></footer>
    </main>

    <div id="map" class="pc-map" hidden role="dialog" aria-label="Map">
      <div class="pc-map-bar">
        <span class="pc-map-title"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z M9 4v13.5 M15 6.5V20"/></svg> Map</span>
        <span id="map-where" class="pc-map-where"></span>
      </div>
      <canvas id="map-canvas" class="pc-map-canvas"></canvas>
      <button type="button" id="map-close" class="pc-map-close">Close map</button>
    </div>

    <div id="message" class="message" hidden>
      <div class="message-card">
        <div class="message-title" id="message-title"></div>
        <div class="message-text" id="message-text"></div>
        <a class="message-link" href="/">Go to the games</a>
      </div>
    </div>

    <script type="module" src="/src/pinecraft/main.ts"></script>
  </body>
</html>
