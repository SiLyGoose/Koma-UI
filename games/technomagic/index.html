<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Koma TechnoMagic Raid</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐲</text></svg>" />
  </head>
  <body>
    <main id="app" class="frame technomagic" data-title="🐲 TechnoMagic Raid">
      <!-- The field: the heroes on the left, the boss on the right (../../src/technomagic/engine/stage.ts). Over it: the health of each hero on it, and a card for each hero (../../src/technomagic/hud/). -->
      <div class="tm-field">
        <canvas id="stage"></canvas>
        <!-- The boss's health, and under it what is the matter with it (stunned, slowed, cursed). -->
        <div id="boss" class="tm-boss" hidden>
          <div class="tm-boss-bar"><i></i><b></b></div>
          <div class="tm-boss-gauge" hidden><i></i></div>
          <div class="tm-marks"></div>
        </div>
        <!-- Auto Repeat on (in a room: ../../src/technomagic/main.ts): Stop Repeat Battle, a fifth of the way down (over the result too), which turns it off. -->
        <button type="button" id="repeat-stop" class="tm-repeat-stop" hidden>Stop Repeat Battle<span class="tm-lights"></span></button>
        <!-- A health bar for each hero, over its head while it is on the field (../../src/technomagic/hud/overhead.ts puts them here). -->
        <div id="overheads"></div>
        <!-- What each blow takes and each heal gives, coming off whom it was (../../src/technomagic/hud/numbers.ts puts them here). -->
        <div id="numbers"></div>
        <!-- Top left: Auto for every hero, and how much damage (or healing) each has done (../../src/technomagic/hud/meter.ts). -->
        <div id="meter" class="tm-meter"></div>
        <!-- Top right: the raid's time left before the boss is enraged, and Leave raid (../../src/technomagic/hud/timer.ts). -->
        <div id="timer" class="tm-timer"></div>
        <div id="party" class="tm-party"></div>

        <!-- Getting ready (a room: ../../src/technomagic/prep/prep.ts): the boss and the stage, the lineup (whose each hero is), the heroes this player owns, the room's chat, and who's in with Ready and Start Battle. Over the field until the fight begins. -->
        <section id="prep" class="tm-prep" aria-labelledby="prep-title" hidden>
          <div class="tm-prep-top">
            <h2 id="prep-title" class="tm-prep-title">Get Ready for Battle</h2>
            <p class="tm-prep-boss"><b id="prep-boss">Galgoria</b> <span id="prep-level"></span></p>
            <!-- Raid Settings: the raid's stage, in the raid's own popup (../../src/shared/ui/level/; only the host changes it). -->
            <button type="button" id="prep-settings" class="tm-prep-settings">Raid Settings</button>
          </div>
          <ol id="lineup" class="tm-lineup" aria-label="Lineup"></ol>
          <div class="tm-prep-bottom">
            <section class="tm-prep-panel tm-prep-heroes" aria-labelledby="prep-heroes-title">
              <div class="tm-prep-panel-head">
                <h3 id="prep-heroes-title" class="tm-prep-panel-title">Heroes List</h3>
                <!-- The Heroes page, to change their gear and such: in a room, in a popup over it (../../src/technomagic/manage/). -->
                <a class="tm-prep-manage" href="/heroes/">Manage</a>
              </div>
              <div id="prep-heroes" class="tm-prep-hero-list"></div>
            </section>
            <div id="prep-chat" class="tm-prep-panel tm-prep-chat"></div>
            <section class="tm-prep-panel tm-prep-party" aria-label="Players">
              <ol id="prep-players" class="tm-prep-players"></ol>
              <p id="prep-note" class="tm-prep-note" role="status"></p>
              <!-- Auto Repeat: a boss beaten, this player is in for the next fight straight from the result (../../src/technomagic/main.ts). -->
              <label class="tm-prep-repeat"><input type="checkbox" id="prep-repeat" /> Auto Repeat</label>
              <div class="tm-prep-actions">
                <button type="button" id="prep-info" class="action secondary" aria-haspopup="dialog">Raid Info</button>
                <button type="button" id="prep-ready" class="action secondary" aria-pressed="false">Ready</button>
                <button type="button" id="prep-start" class="action main large">Start Battle</button>
              </div>
            </section>
          </div>
        </section>
      </div>

      <!-- Under the field, trying things out (no room): the raid's stage, the boss's attacks (a button for each is put here: ../../src/technomagic/hud/actions.ts), Boss auto, which has it attack by itself, Deathless, with which no one falls, and Unique weapons, with which every hero wields its own. -->
      <div id="actions" class="tm-actions">
        <!-- The raid's stage: from 4 on, the boss's skills are harder on the heroes. -->
        <label class="tm-stage">Stage <select id="stage-pick"></select></label>
        <button type="button" id="auto" class="action choice tm-boss-auto" aria-pressed="false" disabled>Boss auto</button>
        <button type="button" id="deathless" class="action choice" aria-pressed="true" hidden>Deathless</button>
        <button type="button" id="unique" class="action choice" aria-pressed="false" hidden>Unique weapons</button>
      </div>
      <p id="hint" class="hint"></p>


      <!-- A fight over: won or lost (the bot's word), what this player got as tiles (the points, and each piece of gear,
           whose details open over it in .tm-loot), what everyone else found, and the way on (../../src/technomagic/result.ts). -->
      <div id="result" class="message tm-result" hidden>
        <div class="message-card">
          <div class="message-title"></div>
          <div class="message-text"></div>
          <div class="tm-rewards" hidden></div>
          <ul class="tm-others" hidden></ul>
          <div class="tm-result-actions"></div>
        </div>
        <div class="tm-loot" hidden></div>
      </div>
    </main>

    <script type="module" src="/src/technomagic/main.ts"></script>
  </body>
</html>
