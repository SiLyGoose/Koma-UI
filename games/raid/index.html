<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Koma Raid</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" />
  </head>
  <body>
    <main id="app" class="frame rd">
      <header class="top">
        <a class="back" href="/" aria-label="Back to the games">←</a>
        <h1>⚔️ Raid <span id="boss-title" class="rd-title-boss"></span></h1>
        <button type="button" id="mute" class="frame-mute" aria-label="Turn sound off" aria-pressed="false">🔊</button>
        <span id="conn" class="conn">Connecting…</span>
      </header>

      <div class="rd-layout">
        <!-- The boss: its picture (angrier as it loses HP), its HP, and what it does next. -->
        <section class="rd-stage">
          <div class="rd-picture">
            <img id="boss-picture" alt="" draggable="false" />
            <div id="boss-tags" class="rd-tags"></div>
          </div>
          <div id="boss-bar" class="rd-bossbar" hidden>
            <div class="rd-bossbar-head"><b id="boss-name"></b><span id="boss-hp"></span></div>
            <div class="rd-bar big"><span id="boss-fill"></span></div>
          </div>
          <div id="intent" class="rd-intent" hidden>
            <span class="rd-label">Next move</span>
            <p id="intent-text"></p>
          </div>
        </section>

        <!-- What there is to do: start the week's raid, the lobby, the fight's actions, or how it ended. -->
        <section class="rd-side">
          <div id="idle" class="rd-panel" hidden>
            <h2 id="idle-title"></h2>
            <p id="idle-text" class="rd-muted"></p>
            <button type="button" id="start" class="rd-button primary" hidden>Start the raid</button>
          </div>

          <div id="lobby" class="rd-panel" hidden>
            <h2>Lobby</h2>
            <p class="rd-muted">The fight starts in <b id="lobby-timer"></b>, or when the host starts it. Boss HP: <b id="lobby-hp"></b> (grows with every raider).</p>
            <ul id="lobby-players" class="rd-list"></ul>
            <div class="rd-row">
              <button type="button" id="join" class="rd-button primary">Join</button>
              <button type="button" id="leave" class="rd-button">Leave</button>
              <button type="button" id="begin" class="rd-button" hidden>Start now</button>
            </div>
          </div>

          <div id="fight" class="rd-panel" hidden>
            <div class="rd-turn">
              <h2 id="round"></h2>
              <span id="turn-text" class="rd-muted"></span>
            </div>
            <div class="rd-bar timer"><span id="turn-fill"></span></div>
            <div id="actions" class="rd-actions">
              <button type="button" class="rd-action attack" data-action="attack"><span>⚔️</span>Attack</button>
              <button type="button" class="rd-action guard" data-action="guard"><span>🛡️</span>Guard</button>
              <button type="button" class="rd-action heal" data-action="heal"><span>💚</span>Heal</button>
              <button type="button" class="rd-action support" data-action="support"><span>✨</span>Support</button>
            </div>
            <p id="act-note" class="rd-note"></p>
            <!-- Heal: who to heal, when anyone is hurt. -->
            <div id="heal-pick" class="rd-heal" hidden>
              <span class="rd-label">Heal who?</span>
              <div id="heal-options" class="rd-heal-options"></div>
            </div>
          </div>

          <div id="over" class="rd-panel" hidden>
            <h2 id="over-title"></h2>
            <p id="over-text" class="rd-muted"></p>
            <ol id="over-ranking" class="rd-list ranked"></ol>
          </div>

          <div id="party-panel" class="rd-panel" hidden>
            <h3>Party</h3>
            <ul id="party" class="rd-party"></ul>
          </div>

          <div id="log-panel" class="rd-panel" hidden>
            <h3>Action log</h3>
            <ol id="log" class="rd-log"></ol>
          </div>
        </section>
      </div>

      <div id="toast" class="rd-toast" role="status" hidden></div>
    </main>

    <div id="message" class="message" hidden>
      <div class="message-card">
        <div class="message-title" id="message-title"></div>
        <div class="message-text" id="message-text"></div>
        <a class="message-link" href="/">Go to the games</a>
      </div>
    </div>

    <script type="module" src="/src/raid/main.ts"></script>
  </body>
</html>
